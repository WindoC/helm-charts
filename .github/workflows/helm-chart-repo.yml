name: Publish Helm Chart Repo

on:
  push:
    branches:
      - master
    paths:
      - "**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          mkdir -p repo
          helm package charts/guacamole -d repo

      - name: Update index
        run: |
          helm repo index repo --url https://windoc.github.io/helm-charts

      - name: Add index.html redirect
        run: |
          cat > repo/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>helm-charts</title>
              <meta http-equiv="refresh" content="0; url=https://github.com/WindoC/helm-charts" />
              <link rel="canonical" href="https://github.com/WindoC/helm-charts" />
              <style>
                :root {
                  color-scheme: light dark;
                }
                body {
                  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                  margin: 0;
                  padding: 48px 16px;
                  line-height: 1.5;
                }
                main {
                  max-width: 720px;
                  margin: 0 auto;
                }
                a {
                  color: inherit;
                }
                .card {
                  padding: 20px 18px;
                  border: 1px solid rgba(127, 127, 127, 0.35);
                  border-radius: 12px;
                }
                code {
                  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                    "Liberation Mono", "Courier New", monospace;
                  font-size: 0.95em;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>helm-charts</h1>
                <div class="card">
                  <p>
                    Redirecting to the GitHub repository:
                    <a href="https://github.com/WindoC/helm-charts">github.com/WindoC/helm-charts</a>
                  </p>
                  <p>
                    Helm repo index:
                    <a href="./index.yaml"><code>index.yaml</code></a>
                  </p>
                </div>
                <noscript>
                  <p>
                    JavaScript is disabled; use this link:
                    <a href="https://github.com/WindoC/helm-charts">github.com/WindoC/helm-charts</a>
                  </p>
                </noscript>
                <script>
                  window.location.replace("https://github.com/WindoC/helm-charts");
                </script>
              </main>
            </body>
          </html>
          EOF

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          publish_branch: gh-pages
