names:
  configMap: n8n-config
  secret: n8n-secrets
  n8nDeployment: n8n
  n8nService: n8n
  n8nPvc: n8n-data
  postgresService: postgres
  postgresStatefulSet: postgres

namespace:
  create: false

n8n:
  replicaCount: 1
  strategy:
    type: Recreate
  image:
    repository: docker.n8n.io/n8nio/n8n
    tag: 2.4.7
    pullPolicy: IfNotPresent
  initPermissions:
    enabled: true
    image:
      repository: busybox
      tag: "1.36.1"
      pullPolicy: IfNotPresent
  resources: {}

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  resources: {}
  persistence:
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    #storageClassName: ""
    volumeMode: Filesystem
    subPath: data
    pvcRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    partition: 0

service:
  n8n:
    type: ClusterIP
    port: 5678
    targetPort: 5678
    name: http
  postgres:
    type: ClusterIP
    port: 5432
    targetPort: 5432
    name: psql

ingress:
  enabled: false
  name: n8n-ingress
  #ingressClassName: ""
  annotations: {}
  host: n8n.example.com
  path: /(.*)
  pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: n8n-tls-cert

persistence:
  createPvc: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  #storageClassName: ""
  volumeMode: Filesystem
  mountPath: /home/node/.n8n
  subPath: .n8n

configMap:
  create: true
  data:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_SCHEMA: public
    GENERIC_TIMEZONE: UTC
    TZ: UTC
    N8N_HOST: n8n.example.com
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_RUNNERS_ENABLED: "true"
    WEBHOOK_URL: https://n8n.example.com/

secret:
  create: true
  DB_POSTGRESDB_PASSWORD: "db_password_change_me"

nodeSelector: {}
tolerations: []
affinity: {}
