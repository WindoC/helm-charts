{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ include "n8n.namespace" . | quote }}
  labels:
    {{- include "n8n.commonLabels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-cookie-path: / /
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.configMap.data.N8N_HOST | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Values.names.n8nService }}
                port:
                  name: {{ .Values.service.n8n.name }}
            path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.configMap.data.N8N_HOST | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
