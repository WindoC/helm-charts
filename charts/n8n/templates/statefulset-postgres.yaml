apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.names.postgresStatefulSet }}
  namespace: {{ include "n8n.namespace" . | quote }}
  labels:
    io.kompose.service: postgres
    {{- include "n8n.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  serviceName: {{ .Values.names.postgresService }}
  podManagementPolicy: {{ .Values.postgres.podManagementPolicy }}
  selector:
    matchLabels:
      io.kompose.service: postgres
  updateStrategy:
    type: {{ .Values.postgres.updateStrategy.type }}
    {{- if eq .Values.postgres.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.postgres.updateStrategy.partition }}
    {{- end }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.postgres.persistence.pvcRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.postgres.persistence.pvcRetentionPolicy.whenScaled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        volumeMode: {{ .Values.postgres.persistence.volumeMode }}
  template:
    metadata:
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.postgres.targetPort }}
              name: {{ .Values.service.postgres.name }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.names.configMap }}
                  key: DB_POSTGRESDB_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.names.configMap }}
                  key: DB_POSTGRESDB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.names.secret }}
                  key: DB_POSTGRESDB_PASSWORD
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              subPath: {{ .Values.postgres.persistence.subPath }}
              name: postgres-data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
