{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.secret }}
  namespace: {{ include "n8n.namespace" . | quote }}
  labels:
    io.kompose.service: n8n
    {{ include "n8n.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DB_POSTGRESDB_PASSWORD: {{ .Values.secret.DB_POSTGRESDB_PASSWORD | quote }}
{{- end }}
