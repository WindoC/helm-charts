apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.names.postgresStatefulSet }}
  namespace: {{ include "guacamole.namespace" . | quote }}
  labels:
    io.kompose.service: postgres
    {{- include "guacamole.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  serviceName: {{ .Values.names.postgresService }}
  podManagementPolicy: {{ .Values.postgres.podManagementPolicy }}
  selector:
    matchLabels:
      io.kompose.service: postgres
  updateStrategy:
    type: {{ .Values.postgres.updateStrategy.type }}
    {{- if eq .Values.postgres.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.postgres.updateStrategy.partition }}
    {{- end }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.postgres.persistence.pvcRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.postgres.persistence.pvcRetentionPolicy.whenScaled }}
  volumeClaimTemplates:
    - metadata:
        name: db-pvc
      spec:
        accessModes:
          {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        volumeMode: {{ .Values.postgres.persistence.volumeMode }}
  template:
    metadata:
      labels:
        io.kompose.service: postgres
    spec:
      {{- if .Values.postgres.initdb.enabled }}
      initContainers:
        - name: initdb
          image: "{{ .Values.guacamole.image.repository }}:{{ .Values.guacamole.image.tag }}"
          imagePullPolicy: {{ .Values.guacamole.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - /opt/guacamole/bin/initdb.sh --postgresql > /initdb/initdb.sql
          volumeMounts:
            - name: initdb
              mountPath: /initdb
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.names.configMap }}
                  key: POSTGRESQL_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.names.configMap }}
                  key: POSTGRESQL_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.names.secret }}
                  key: DB_POSTGRESDB_PASSWORD
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: db-pvc
              mountPath: /var/lib/postgresql/data
              subPath: {{ .Values.postgres.persistence.subPath }}
            {{- if .Values.postgres.initdb.enabled }}
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
      {{- if .Values.postgres.initdb.enabled }}
      volumes:
        - name: initdb
          emptyDir: {}
      {{- end }}
