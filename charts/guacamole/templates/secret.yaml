{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.secret }}
  namespace: {{ include "guacamole.namespace" . | quote }}
  labels:
    {{- include "guacamole.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DB_POSTGRESDB_PASSWORD: {{ .Values.secret.DB_POSTGRESDB_PASSWORD | quote }}
{{- end }}
