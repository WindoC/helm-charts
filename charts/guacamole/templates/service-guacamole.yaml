apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.names.guacamoleService }}
  namespace: {{ include "guacamole.namespace" . | quote }}
  labels:
    io.kompose.service: guacamole
    {{- include "guacamole.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: guacamole
  ports:
    - name: guacamole
      port: 8080
      protocol: TCP
      targetPort: 8080
