apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.names.postgresService }}
  namespace: {{ include "guacamole.namespace" . | quote }}
  labels:
    io.kompose.service: postgres
    {{- include "guacamole.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: postgres
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
